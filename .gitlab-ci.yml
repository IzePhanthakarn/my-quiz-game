stages:
  - build
  - deploy
  - build-sso-uat
  - deploy-sso-uat
  - build-sso-dev
  - deploy-sso-dev

variables:
  K8S_NAMESPACE : "frontend" # ใช้ frontend หรือ backend หรือ machine-learning
  BUILD_IMAGE_NAME : "wcf2/med/med-frontend" # เปลี่ยนตามชื่อ wcf/<module>/<service_name>
  PROJECT_NAME : "${CI_PROJECT_NAME}"
  COMMIT_ID : "${CI_COMMIT_SHA}"
  GIT_STRATEGY: clone

before_script:
  - echo "$PROJECT_NAME $BRANCH $COMMIT_ID"
  - echo "$CI_SERVER_SHELL_SSH_HOST"
  - export git_Build_id=$(echo $COMMIT_ID | cut -c1-8)
  - export build_time=$(date +"%Y-%m-%dT%H:%M:%SZ")
#  - docker login -u=$REGISTRY_USER -p=$REGISTRY_PASS $REGISTRY_UAT

.pipeline_rule_uat: &pipeline_rule_uat
  - if: $CI_COMMIT_BRANCH == "uat" &&
      $CI_SERVER_SHELL_SSH_HOST == "git.sso.go.th"
    variables:
      HELM_VAR_FILE: >
        -f ./deployment/default.yaml -f ./deployment/uat.yaml

.pipeline_rule_dev: &pipeline_rule_dev
  - if: $CI_COMMIT_BRANCH == "dev" &&
      $CI_SERVER_SHELL_SSH_HOST == "gitlab.com"
    variables:
      HELM_VAR_FILE: >
        -f ./deployment/default-dev.yaml -f ./deployment/dev.yaml    

build:
  stage: build
  script:
    - echo "Build application..."
    - docker ps
    - |
      echo -e "$ENV_DEV" > .env
    - docker build -t ums-frontend.latest ./
    - docker system prune -f
  rules: *pipeline_rule_dev

deploy:
  stage: deploy
  script:
    - docker compose up -d
  rules: *pipeline_rule_dev


build-sso-uat:
  stage: build-sso-uat
  script:
    - echo $REGISTRY_USER
    - echo $REGISTRY_UAT
    - export VERSION=$(grep version package.json | cut -f 2 -d  ':'  | tr -d ' ",')
    - echo "Current version- $VERSION"
    - docker login -u=$REGISTRY_USER -p=$REGISTRY_PASS $REGISTRY_UAT
    - |
      cp -f .env.uat .env.production
    - |
      docker build  -f Dockerfile-sso \
          --build-arg https_proxy='http://172.16.11.231:8080' \
          --build-arg http_proxy='http://172.16.11.231:8080' \
          --build-arg no_proxy="localhost,internal.domain,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.16.7.0/24,172.20.81.0/24,ry-c4tkg-uat-tkc01-harbor.ssomgmt.go.th,ry-c4tkg-prd-tkc01-harbor.ssomgmt.go.th,nb-c4tkg-prd-tkc01-harbor.ssomgmt.go.th" \
          --build-arg WEBCMP_VERSION=latest \
          --build-arg RDX_VERSION=latest \
          -t $REGISTRY_UAT/$BUILD_IMAGE_NAME:$git_Build_id .
    - docker system prune -f
    - docker tag $REGISTRY_UAT/$BUILD_IMAGE_NAME:$git_Build_id $REGISTRY_UAT/$BUILD_IMAGE_NAME:latest
    - docker push $REGISTRY_UAT/$BUILD_IMAGE_NAME:$git_Build_id
    - docker push $REGISTRY_UAT/$BUILD_IMAGE_NAME:latest
  variables:
    GIT_STRATEGY: fetch
  rules: *pipeline_rule_uat

deploy-sso-dev:
  stage: deploy-sso-dev
  script:
    - echo "Deploying to DEV"
    - echo "Current version- $git_Build_id"
    - echo $HELM_REPO_NAME
    - |
      sed -i "s/tag: \"latest\"/tag: \"$git_Build_id\"/" ./deployment/default-dev.yaml
    - helm upgrade -i -n $K8S_NAMESPACE $HELM_VAR_FILE $PROJECT_NAME $HELM_REPO_NAME --insecure-skip-tls-verify
  rules: *pipeline_rule_uat



deploy-sso-uat:
  stage: deploy-sso-uat
  script:
    - echo "Deploying to UAT"
    - echo "Current version- $git_Build_id"
    - echo $HELM_REPO_NAME
    - |
      sed -i "s/tag: \"latest\"/tag: \"$git_Build_id\"/" ./deployment/default.yaml
    - helm upgrade -i -n $K8S_NAMESPACE $HELM_VAR_FILE $PROJECT_NAME $HELM_REPO_NAME --insecure-skip-tls-verify
  rules: *pipeline_rule_uat

