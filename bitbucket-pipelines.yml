definitions:
  steps:
    - step: &SetEnvironmentVariables
        name: "Set environment variables"
        script:
          - echo "export DOCKER_SOILFISH_PASS_TOKEN=$DOCKER_SOILFISH_PASS_TOKEN" >> .envs
          - echo "export VERSION=$(grep version package.json | cut -f 4 -d ' ' | tr -d '",')" >> .envs
          - export VERSION=$(grep version package.json | cut -f 4 -d ' ' | tr -d '",')
          - export SUFFIX_VERSION=${BITBUCKET_COMMIT:0:7}
          - echo "export IMAGE_FIX=soilfish/medical-web:${VERSION}" >> .envs
          - echo "export IMAGE_UPD=soilfish/medical-web:${VERSION}-${SUFFIX_VERSION}" >> .envs
          - echo "export ENV=$ENV" >> .envs
          - echo "export IMAGE_TAG=${VERSION}-${BITBUCKET_COMMIT:0:7}" >> .envs
          - echo "export WCFD_KUBE_CONFIG=$WCFD_KUBE_CONFIG" >> .envs
        artifacts:
          - .envs
    - step: &BuildImage
        name: Build and push Image
        size: 2x
        image: quay.io/vmoteam/ci-node:v12-gitops
        caches:
          - gradle
        services: [docker-with-large-memory]
        script:
          - source .envs
          - echo ${DOCKER_SOILFISH_PASS_TOKEN} | docker login --username soilfish --password-stdin
          - echo $IMAGE_FIX
          - echo $HOME
          - docker build -f ./Dockerfile -t $IMAGE_FIX .
          - docker tag $IMAGE_FIX $IMAGE_UPD
          - echo ${DOCKER_SOILFISH_PASS_TOKEN} | docker login --username soilfish --password-stdin
          - docker push $IMAGE_FIX
          - docker push $IMAGE_UPD
        artifacts:
          paths:
            - build
    - step: &Deploy
        name: Deploy
        trigger: manual
        image:
          name: alpine/helm:latest
        script:
          - source .envs
          - helm version
          - mkdir -p ~/.kube
          - echo $ENV
          - echo -n $WCFD_KUBE_CONFIG | base64 -d > ~/.kube/config
          - chmod 400 ~/.kube/config
          - cd helm/med-web
          - helm --namespace default upgrade --install --kubeconfig "/root/.kube/config" med-web . --set image.tag=$IMAGE_TAG -f values.yaml --history-max 3 --set podAnnotations.deployedDate=$(date +%Y-%m-%dT%H:%M:%S)
  services:
    docker:
      memory: 1024
    docker-with-large-memory:
      memory: 2048
      type: docker

pipelines:
  branches:
    dev-test:
      - step:
          deployment: development
          <<: *SetEnvironmentVariables
      - step:
          <<: *BuildImage
    develop:
      - step:
          deployment: development
          <<: *SetEnvironmentVariables
      - step:
          <<: *BuildImage
      - step:
          <<: *Deploy
    release/*:
      - step:
          deployment: staging
          <<: *SetEnvironmentVariables
      - step:
          <<: *BuildImage
      - step:
          <<: *Deploy
    master:
      - step:
          deployment: production
          <<: *SetEnvironmentVariables
      - step:
          <<: *BuildImage
      - step:
          <<: *Deploy
