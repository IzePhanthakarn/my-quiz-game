apiVersion: v1
kind: Service
metadata:
  name: medical-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: medical-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medical-web
  template:
    metadata:
      labels:
        app: medical-web
    spec:
      imagePullSecrets:
        - name: soilfish-registry-secret
      automountServiceAccountToken: false
      containers:
        - name: medical-web
          image: soilfish/medical-web:0.1.0
          resources:
            limits:
              cpu: 188m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 400Mi
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: medical-web
